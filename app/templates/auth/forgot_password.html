{% extends "auth/base_auth.html" %}
{% block title %}Forgot Password — CogMonitor{% endblock %}

{% block auth_content %}
<div class="auth-shell auth-shell-single">
    <div class="auth-panel auth-panel-form auth-panel-centered">
        <div class="auth-form-card">
            <div class="auth-mobile-logo justify-content-center mb-3">
                <div class="auth-logo-sm"><i class="bi bi-shield-lock"></i></div>
            </div>

            <div class="auth-form-head text-center">
                <h2>Forgot your password?</h2>
                <p>Enter your email or username and we'll help you regain access</p>
            </div>

            <form method="POST" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="login">Email or Username</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-person auth-field-icon"></i>
                        <input type="text" id="login" name="login" class="form-control"
                               placeholder="you@email.com or username" required>
                    </div>
                </div>

                <button type="submit" class="btn auth-btn-primary w-100">
                    <i class="bi bi-send me-2"></i>Send Reset Request
                </button>
            </form>

            <div class="auth-separator"><span>Remember it?</span></div>

            <a href="{{ url_for('auth.login') }}" class="btn auth-btn-outline w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
